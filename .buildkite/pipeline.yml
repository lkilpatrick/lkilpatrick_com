# Buildkite deployment intentionally disabled.
# Firebase Hosting production and PR preview deployments are now handled by
# .github/workflows/firebase-hosting-merge.yml and
# .github/workflows/firebase-hosting-pull-request.yml.
# Leave a no-op pipeline so an existing Buildkite webhook cannot deploy.
steps:
  - label: ":no_entry: Firebase deployment moved to GitHub Actions"
    command: "echo 'Buildkite deployment disabled; use GitHub Actions for Firebase Hosting.'"
