name: Capture Mia Kingtide website screenshot
on:
  push:
    branches: [improve/portfolio-story-mia-site-20261118]
    paths:
      - '.github/workflows/capture-sand-city.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture real live website with Chrome
        run: |
          set -eu
          mkdir -p public/screenshots
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --virtual-time-budget=9000 --screenshot=public/screenshots/work-mia-kingtide.png https://miakingtide.com/
          test "$(stat -c%s public/screenshots/work-mia-kingtide.png)" -gt 30000
      - name: Commit screenshot to working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/screenshots/work-mia-kingtide.png
          git commit -m "Capture live Mia Kingtide website for Work portfolio" || exit 0
          git pull --rebase origin improve/portfolio-story-mia-site-20261118
          git push origin HEAD:improve/portfolio-story-mia-site-20261118
